name: Docker build verification

on:
  push:
    branches:
      - chore/docker-parallel
      - feat/self-hosted-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build and smoke-test in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all services and run smoke tests
        run: sh ./docker-verify.sh
