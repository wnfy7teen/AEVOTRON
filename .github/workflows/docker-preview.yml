name: Docker preview

on:
  push:
    branches:
      - feat/docker-parallel
  pull_request:
    branches:
      - feat/docker-parallel

permissions:
  contents: read

concurrency:
  group: docker-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-smoke-test:
    name: Build image and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: aevotron:docker-preview
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Nitro server output exists in image
        run: docker run --rm --entrypoint sh aevotron:docker-preview -c 'test -f /app/.output/server/index.mjs'

      - name: Start isolated preview container
        run: docker run -d --name aevotron-preview-smoke -p 127.0.0.1:3001:3000 aevotron:docker-preview

      - name: Wait for HTTP response
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ -o /tmp/aevotron-home.html; then
              break
            fi
            sleep 2
          done
          test -s /tmp/aevotron-home.html
          grep -Eqi '<html|<!doctype' /tmp/aevotron-home.html

      - name: Collect container logs on failure
        if: failure()
        run: docker logs aevotron-preview-smoke || true

      - name: Remove preview container
        if: always()
        run: docker rm -f aevotron-preview-smoke || true
