name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "infra/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run security policy tests
        run: npm test

      - name: Install self-hosted backend dependencies
        run: npm --prefix backend install --no-audit --no-fund

      - name: Test self-hosted backend security primitives
        run: npm --prefix backend test

      - name: Check standalone API syntax
        run: node --check backend/src/server.js && node --check backend/src/security.js

      - name: Verify Base44 runtime dependencies are removed
        run: |
          if grep -R -nE "@base44|base44Client|createClientFromRequest|asServiceRole|base44/functions|base44:" src package.json vite.config.js; then
            echo "A Base44 runtime reference remains in the self-hosted branch."
            exit 1
          fi
          test ! -d base44

      - name: Run ESLint
        run: npm run lint

      - name: Build production application (Vercel / Docker Nitro)
        run: npm run build

      - name: Build Cloudflare Workers preview
        run: npm run build:cloudflare
