services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aevotron
      POSTGRES_USER: aevotron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aevotron-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevotron -d aevotron"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    image: aevotron-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://aevotron:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aevotron
      AEVOTRON_MASTER_KEY: ${AEVOTRON_MASTER_KEY:?Set AEVOTRON_MASTER_KEY in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aevotron:
    image: aevotron:docker-preview
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      API_INTERNAL_URL: http://backend:3001
      AEVOTRON_GATEWAY_URL: http://backend:3001/v1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aevotron:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  aevotron-postgres:
